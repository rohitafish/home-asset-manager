# Per-repo configuration for scripts/check-pii.sh, which is a SHARED ENGINE:
# that file is byte-identical in assetmgt and gmail_labels, and everything
# that differs between them is here. Tracked, because none of it is secret --
# it is locations and policy, never values.

# Where a human reads about this check.
PII_DOC_HINT="AGENTS.md's \"PII / privacy\" section"

# Paths that must never be tracked. .gitignore is the only thing keeping the
# secrets in .env out of git, and `git add -f .env` silently defeats it.
# .env.example is the tracked template and must stay allowed, so match the
# bare/base names only, not the .example suffix.
PII_SECRET_FILE_RE='(^|/)\.env$|(^|/)\.env\.(local|production|prod)$'

# UK personal identifiers (NI numbers, postcodes, sort codes, mobiles): OFF.
# This repo's data is devices, not correspondence -- a sort code is shaped
# exactly like a date, and every ISO date in the test fixtures would warn.
PII_UK_RULES=0

# WARN when a commit adds a file git cannot grep inside. ON: no commit in this
# history has ever added one (checked), so it costs nothing today and catches
# the first spreadsheet of real data someone commits.
PII_OFFICE_FILE_WARN=1

# The sibling repo sharing this engine -- tests/test_check_pii_shared.py uses
# it to catch the two copies drifting apart. Relative to this repo's root.
PII_SIBLING="../gmail_labels"

# Dotted quads confirmed NOT to be real addresses, scoped to the file each
# appears in. The bar is "confirmed", not "probably fine".
#
#   1.9.1.10      a Sonos software version string, not an address. Appears in
#                 the test fixture, in this conf, and in the engine's own
#                 comments -- a literal written here puts the digits in this
#                 file too, so the list has to cover its own source.
#   8.8.8.8       Google Public DNS: the canonical "obviously not on my LAN,
#                 reject it" fixture, used by three SSRF/argv guards.
#   203.0.113.7   inside 203.0.113.0/24, the RFC 5737 TEST-NET-3 block
#                 reserved for documentation and never assignable, used to
#                 confirm the "genuine public address" WARN path still fires.
#
# Both scripts/check-pii.sh and scripts/check-pii.conf are listed for the
# self-covering entries: these literals used to live in the script, so every
# commit made before they moved here still carries them there, and --full
# scans those trees too. Dropping the .sh entries when the content moved
# turned eight historical lines back into warnings -- caught by running
# --full, which is why that run is part of making this kind of change.
PII_IP_ALLOWLIST='tests/test_sonos_api.py|1.9.1.10
scripts/check-pii.conf|1.9.1.10
scripts/check-pii.sh|1.9.1.10
tests/test_check_pii.py|1.9.1.10
tests/test_sonos_api.py|8.8.8.8
tests/test_ping.py|8.8.8.8
tests/test_sonos_household.py|8.8.8.8
tests/test_check_pii.py|203.0.113.7
scripts/check-pii.conf|8.8.8.8
scripts/check-pii.sh|8.8.8.8
scripts/check-pii.conf|203.0.113.7
scripts/check-pii.sh|203.0.113.7
scripts/check-pii.conf|203.0.113.0
scripts/check-pii.sh|203.0.113.0'
