{% extends "base.html" %}
{% block title %}Locations{% endblock %}
{% block content %}
<h2>Locations</h2>

<table>
  <thead><tr><th>Name</th><th>Description</th><th>Assets</th></tr></thead>
  <tbody>
    {% for loc in locations %}
    <tr>
      <td><a href="/locations/{{ loc.id }}">{{ loc.name }}</a></td>
      <td>{{ loc.description or "—" }}</td>
      <td>{{ counts.get(loc.id, 0) }}</td>
    </tr>
    {% else %}
    <tr><td colspan="3">No locations yet.</td></tr>
    {% endfor %}
  </tbody>
</table>

<h3>Add a location</h3>
<form method="post" action="/locations/new" class="asset-form">
  <label>Name
    <input type="text" name="name" required>
  </label>
  <label>Description
    <input type="text" name="description">
  </label>
  <button type="submit">Add</button>
</form>
{% endblock %}
