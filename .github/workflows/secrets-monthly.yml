# Monthly verified-credential sweep of the full history with TruffleHog.
# gitleaks (ci.yml, and the hooks) matches credential SHAPES; TruffleHog
# additionally VERIFIES candidates against the issuing provider, so a
# finding here means a live, working credential is in the public history --
# rotate it first, ask questions after. --only-verified keeps it silent
# otherwise. Runs on the 1st at 06:40 UTC and on demand.
name: Secrets (monthly, verified)

on:
  schedule:
    - cron: '40 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@a5f3de55cc2065ae4dde8fee24076f137fd62fcf  # v3.97.8
        with:
          path: ./
          extra_args: --only-verified
