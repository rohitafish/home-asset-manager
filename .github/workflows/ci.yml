name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly as well, so a newly published advisory against a pinned
  # dependency turns the badge red on its own (the pip-audit step below)
  # instead of waiting for the next push to notice it.
  schedule:
    - cron: '23 6 * * 1'

# Explicit, minimal token permissions: this workflow only reads the repo and
# runs tests/lint/the PII scan -- it never needs to write anything. Currently
# redundant with the repo's own default (Settings -> Actions -> read-only),
# but stated here so it stays true even if that default is ever loosened.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # check-pii.sh scans commit history, so fetch it all rather than the
          # default shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'  # the Mini's version and ruff.toml's target -- the production floor
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # --require-hashes: requirements*.txt are uv-generated (--universal)
        # lockfiles with a sha256 for every wheel across every platform, so
        # this installs exactly the bytes that were tested -- a substituted
        # release fails here rather than running. pip
        # itself is pinned first because it isn't in the lock (pip can't
        # hash-verify its own upgrade) and the runner's copy has had its own
        # advisories.
        run: |
          pip install pip==26.2.1
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Dependency vulnerability audit (pip-audit)
        # Audits the lockfiles themselves against PyPI's advisory database
        # (OSV/PyPA). --no-deps because the files are fully pinned and hashed,
        # so there's nothing to resolve; --strict fails on any finding, and on
        # a dependency it can't find in the index. pipx keeps pip-audit's own
        # dependencies out of the environment being audited.
        run: >
          pipx run --spec pip-audit==2.10.1 pip-audit
          --strict --desc on --require-hashes --no-deps
          -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        # Run under coverage rather than as a bare `pytest -q`: same tests,
        # same pass/fail, but it also collects the data the next step checks.
        # Kept as two steps so a red X is unambiguous -- this one failing
        # means a test broke, the next one failing means coverage dropped.
        run: coverage run -m pytest -q

      - name: Coverage (threshold in .coveragerc)
        run: coverage report

      - name: PII / secret scan
        # .pii-denylist is gitignored and dev-machine-only, so it's absent here:
        # check-pii WARNs about that and still runs the portable structural,
        # secret, and tracked-.env rules (exit non-zero only on a real FAIL).
        run: bash scripts/check-pii.sh --full

  # Separate job, not a step in `test` above: the suite above runs against
  # in-memory SQLite (tests/conftest.py), which is deliberate for speed and
  # isolation -- but it means no migration in migrations/versions/ is ever
  # executed by that job, and nothing there detects model/migration drift.
  # AGENTS.md's "Dates and timestamps" and "Money and valuation" sections
  # both name that as a real, documented gap. This job closes it: apply
  # every migration to a real Postgres from empty, confirm the models match
  # what the migrations produce, and confirm downgrade doesn't just "not
  # error" but actually leaves a database upgrade can run against again --
  # weaker downgrade testing (drop the tables, forget the enum types)
  # missed exactly that until this ran once by hand while writing it (see
  # migrations/versions/116cb2da1cef_initial_schema.py's downgrade() fix).
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: assetmgt
          POSTGRES_PASSWORD: assetmgt
          POSTGRES_DB: assetmgt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assetmgt -d assetmgt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Explicit, not left to migrations/env.py's load_dotenv() -- there is
      # no .env file in CI (gitignored), and even if there were, a
      # workflow-level env var here is the unambiguous source of truth for
      # what this job's Postgres actually is: the ephemeral service
      # container above, never a developer's real local or deployed database.
      DATABASE_URL: postgresql+psycopg://assetmgt:assetmgt@localhost:5432/assetmgt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # requirements.txt only -- alembic/sqlmodel/psycopg live there, not
        # in requirements-dev.txt, and this job doesn't run pytest/ruff.
        run: |
          pip install pip==26.2.1
          pip install --require-hashes -r requirements.txt

      - name: Apply every migration to a real Postgres, from empty
        run: alembic upgrade head

      - name: Check for model/migration drift
        # Fails if `alembic revision --autogenerate` would produce a diff --
        # i.e. app/models.py changed without a matching migration. Nothing
        # else catches this: the SQLite-backed suite builds its schema
        # straight from SQLModel.metadata, so it can't tell a model change
        # apart from a model change plus its migration.
        run: alembic check

      - name: Downgrade to base and back up to head
        # Every migration defines a downgrade(); until this job existed, none
        # had ever actually been run. Round-tripping (not just downgrading)
        # is the real test -- a downgrade that "succeeds" but leaves
        # something behind (as the enum-type gap here did) only surfaces on
        # the upgrade that follows it.
        run: |
          alembic downgrade base
          alembic upgrade head
