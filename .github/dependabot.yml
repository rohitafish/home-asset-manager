version: 2
updates:
  # Python dependencies: requirements*.in (direct pins) and the uv-generated
  # lockfiles compiled from them (requirements*.txt, with hashes -- see
  # CONTRIBUTING.md's "Dependencies" for the `uv pip compile --universal`
  # command, and why --universal matters). If a Dependabot PR ever lands
  # with bare pins and no hashes, regenerate by hand before merging.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # sqlmodel 0.0.47 rejects naive datetimes and maps datetime fields to
      # a tz-aware column type (drift on ~20 columns). Held back until the
      # code moves off utcnow()/naive datetimes and a timestamptz migration
      # lands -- remove this entry in that PR.
      - dependency-name: sqlmodel
        versions: [">=0.0.47"]

  # The GitHub Actions used by the CI workflow.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
