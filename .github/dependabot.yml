version: 2
updates:
  # Python dependencies: requirements*.in (direct pins) and the pip-compile
  # lockfiles generated from them (requirements*.txt, with hashes). Dependabot
  # detects the pip-compile header and regenerates the lock in its PRs.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The GitHub Actions used by the CI workflow.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
